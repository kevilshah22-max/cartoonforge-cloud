name: CartoonForge — Nafay Style Renderer

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic / video title"
        required: true
        type: string
        default: "Your Veins Aren’t Actually Blue"
      script:
        description: "Fact-checked narration script (70–125 words, 30–40 second target)"
        required: true
        type: string
        default: "Your veins look blue—but your blood is not. So what are you actually seeing? Human blood gets its red colour from haemoglobin, the oxygen-carrying protein inside red blood cells. When haemoglobin carries oxygen, blood appears brighter red. After releasing oxygen into tissues, it becomes darker red—not blue. The blue appearance comes from how light travels through skin and tissue: different wavelengths are absorbed and scattered before the reflected light reaches your eyes. So the next time you spot blue veins, remember: the blood inside them is still red. The real trick is light, not colour-changing blood."
      style:
        description: "Any slug from the Nafay 3D Style Library catalogue"
        required: true
        type: string
        default: bio-glow
      voice:
        description: "Local Kokoro narration voice"
        required: true
        type: choice
        options: [bf_emma, bm_george, bm_fable, am_michael, am_puck, am_fenrir, am_onyx, af_heart, af_bella, af_nicole]
        default: bf_emma
      sources:
        description: "At least two reliable source URLs, separated by semicolons or new lines"
        required: true
        type: string
        default: "https://www.ncbi.nlm.nih.gov/books/NBK2263/;https://pdb101.rcsb.org/motm/41;https://www.scienceline.ucsb.edu/getkey.php?key=6854"

permissions:
  contents: read

concurrency:
  group: cartoonforge-nafay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out CartoonForge
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg curl unzip fonts-liberation wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
          sudo apt-get install --yes /tmp/google-chrome.deb
          google-chrome --version
          ffmpeg -version | head -n 1
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Validate Nafay adapter syntax
        run: python -m py_compile cartoonforge/nafay_engine.py

      - name: Install Nafay rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy kokoro-onnx faster-whisper

      - name: Generate narrated Nafay-style animation
        env:
          NAFAY_TOPIC: ${{ inputs.topic }}
          NAFAY_SCRIPT: ${{ inputs.script }}
          NAFAY_STYLE: ${{ inputs.style }}
          NAFAY_VOICE: ${{ inputs.voice }}
          NAFAY_SOURCES: ${{ inputs.sources }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
        run: python cartoonforge/nafay_engine.py

      - name: Upload MP4, contact sheet and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoonforge-nafay-${{ github.run_number }}
          path: cartoonforge-nafay-output/
          if-no-files-found: warn
          retention-days: 7
