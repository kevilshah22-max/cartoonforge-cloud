name: CartoonForge — Create Cartoon Video

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Describe your cartoon idea in one or two sentences"
        required: true
        type: string
      auto_create:
        description: "Use Gemini to write the script and design the recurring character"
        required: true
        type: boolean
        default: true
      script:
        description: "Optional script or extra story direction (Gemini can write it)"
        required: false
        type: string
      character:
        description: "Optional character direction (Gemini can design it)"
        required: false
        type: string
      style:
        description: "Cartoon art direction"
        required: true
        type: choice
        options:
          - 3D family animation
          - 2D hand-drawn cartoon
          - Anime-inspired animation
          - Watercolour storybook
          - Claymation
      scenes:
        description: "Number of illustrated scenes; OVHcloud anonymous API is limited to 2 requests/minute"
        required: true
        type: choice
        options: ["3", "4", "5", "6", "8"]
        default: "3"
      voice:
        description: "Narration voice"
        required: true
        type: choice
        options:
          - en-US-AriaNeural-Female
          - en-US-GuyNeural-Male
          - no-voice
        default: en-US-AriaNeural-Female

permissions:
  contents: read

concurrency:
  group: cartoonforge-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out CartoonForge
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1

      - name: Install project dependencies
        run: uv sync --frozen --no-dev

      - name: Generate cartoon video
        env:
          CARTOON_IDEA: ${{ inputs.idea }}
          CARTOON_AUTO_CREATE: ${{ inputs.auto_create }}
          CARTOON_SCRIPT: ${{ inputs.script }}
          CARTOON_CHARACTER: ${{ inputs.character }}
          CARTOON_STYLE: ${{ inputs.style }}
          CARTOON_SCENES: ${{ inputs.scenes }}
          CARTOON_VOICE: ${{ inputs.voice }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: leave unset for anonymous free-tier image generation.
          OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
        run: uv run python cartoonforge/cloud_runner.py

      - name: Collect generated MP4 files
        if: always()
        run: |
          mkdir -p cartoonforge-output
          # Copy only completed final videos to a flat, predictable upload directory.
          # The runner reports final-*.mp4 paths under storage/tasks; searching from
          # the repository root also handles nested task directories safely.
          find . -type f -path '*/storage/tasks/*/final-*.mp4' -print -exec cp {} cartoonforge-output/ \;
          echo "Collected MP4 files:"
          find cartoonforge-output -maxdepth 1 -type f -name '*.mp4' -print
          test -n "$(find cartoonforge-output -maxdepth 1 -type f -name '*.mp4' -print -quit)"

      - name: Upload finished video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartoonforge-video-${{ github.run_number }}
          path: cartoonforge-output/*.mp4
          if-no-files-found: error
          retention-days: 7
